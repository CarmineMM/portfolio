services:
    dev:
        build:
            context: .
            target: dev
        ports:
            - '4321:4321'
        volumes:
            - .:/app
            - /app/node_modules
        environment:
            - CHOKIDAR_USEPOLLING=true
        profiles: [dev]

    prod:
        build:
            context: .
            target: prod
        ports:
            - '8080:80'
        restart: unless-stopped
        profiles: [prod]
